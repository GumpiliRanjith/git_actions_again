name: experi
on: push

jobs:
  ranjith:
    runs-on: ubuntu-latest

    steps:
      - name: took at repo
        run: echo "hello"
      - name: create file
        run: |
          echo "hello world" > file.txt
      - name: upload file
        uses: actions/upload-artifact@v4
        with:
          name: my-file
          path: file.txt

  kumer:
    needs: ranjith
    runs-on: ubuntu-latest

    steps:
      - name: kumer
        run: echo "HELLO"

  ravi:
    needs: [ranjith,kumer]
    runs-on: ubuntu-latest
    steps:
      - name: welcome flow
        run: echo "MASTER"
    
  master:
    needs: [ranjith,kumer,ravi]
    runs-on: ubuntu-latest
    steps:
      - name: welcome high
        run: echo "high"
      - name: download
        uses: actions/download-artifact@v4
        with:
          name: my-file
      - name: content
        run: cat file.txt


